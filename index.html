<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Python Mobile IDE</title>
    
    <!-- Configurações PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#181825">
    
    <!-- Interpreter Python (Pyodide) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Cabeçalho */
        header {
            background-color: #181825;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #313244;
        }

        .logo { font-weight: bold; font-size: 1.1rem; color: #cba6f7; }

        .header-actions { display: flex; gap: 8px; align-items: center; }

        .btn-run {
            background-color: #a6e3a1;
            color: #11111b;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-install {
            background-color: #313244;
            color: #cba6f7;
            border: 1px solid #cba6f7;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Abas no Celular */
        .tabs { display: flex; background-color: #181825; border-bottom: 1px solid #313244; }

        .tab-btn {
            flex: 1; padding: 10px; background: none; border: none;
            color: #a6adc8; font-size: 0.9rem; font-weight: 600; cursor: pointer;
            border-bottom: 2px solid transparent; text-align: center;
        }

        .tab-btn.active { color: #cba6f7; border-bottom-color: #cba6f7; background-color: #1e1e2e; }

        /* Container Principal */
        .main-container { flex: 1; position: relative; overflow: hidden; }

        .panel { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; }
        .panel.active { display: flex; }

        /* Editor */
        textarea#code {
            width: 100%; flex: 1; background-color: #1e1e2e; color: #a6e3a1;
            font-family: "Courier New", Courier, monospace; font-size: 15px;
            line-height: 1.5; padding: 12px; border: none; outline: none; resize: none;
        }

        /* Atalhos do Teclado Mobile */
        .quick-keys {
            display: flex; background-color: #181825; padding: 6px 10px; gap: 6px;
            overflow-x: auto; border-top: 1px solid #313244; white-space: nowrap;
        }

        .quick-key {
            background-color: #313244; color: #cdd6f4; border: 1px solid #45475a;
            border-radius: 6px; padding: 6px 12px; font-family: monospace; font-size: 14px;
        }

        /* Console */
        #output {
            flex: 1; background-color: #11111b; color: #89b4fa;
            font-family: "Courier New", Courier, monospace; font-size: 14px;
            padding: 12px; overflow-y: auto; white-space: pre-wrap;
        }

        /* Responsividade Desktop */
        @media (min-width: 768px) {
            .tabs, .quick-keys { display: none; }
            .main-container { display: flex; flex-direction: row; gap: 1px; background-color: #313244; }
            .panel { position: relative; display: flex !important; flex: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐍 Python IDE</div>
        <div class="header-actions">
            <button id="btn-install" class="btn-install" style="display: none;" onclick="installPWA()">📥 Baixar App</button>
            <button class="btn-run" onclick="runPython()">▶ Executar</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" id="tab-editor-btn" onclick="switchTab('editor')">📝 Código</button>
        <button class="tab-btn" id="tab-output-btn" onclick="switchTab('output')">💻 Console</button>
    </div>

    <div class="main-container">
        <div class="panel active" id="panel-editor">
            <textarea id="code" spellcheck="false" placeholder="Digite seu código Python aqui...">
# Escreva seu código Python abaixo
nome = "Mundo"
print(f"Olá, {nome}!")

for i in range(1, 6):
    print("Contagem:", i)
            </textarea>

            <div class="quick-keys">
                <button class="quick-key" onclick="insertSymbol('    ')">TAB</button>
                <button class="quick-key" onclick="insertSymbol(':')">:</button>
                <button class="quick-key" onclick="insertSymbol('(')">(</button>
                <button class="quick-key" onclick="insertSymbol(')')">)</button>
                <button class="quick-key" onclick="insertSymbol('&quot;')">"</button>
                <button class="quick-key" onclick="insertSymbol('\'')">'</button>
                <button class="quick-key" onclick="insertSymbol('=')">=</button>
                <button class="quick-key" onclick="insertSymbol('#')">#</button>
            </div>
        </div>

        <div class="panel" id="panel-output">
            <div id="output">Carregando o Python na memória... Aguarde um instante.</div>
        </div>
    </div>

    <script>
        let pyodideReady = false, pyodide, deferredPrompt;

        // 1. Inicializa o Python
        async function initPyodide() {
            pyodide = await loadPyodide();
            document.getElementById("output").innerText = "Pronto para executar! Clique ou toque em 'Executar'.";
            pyodideReady = true;
        }
        initPyodide();

        // 2. Troca de abas no Mobile
        function switchTab(tab) {
            document.getElementById("panel-editor").classList.toggle("active", tab === 'editor');
            document.getElementById("panel-output").classList.toggle("active", tab === 'output');
            document.getElementById("tab-editor-btn").classList.toggle("active", tab === 'editor');
            document.getElementById("tab-output-btn").classList.toggle("active", tab === 'output');
        }

        // 3. Atalhos especiais de teclado
        function insertSymbol(symbol) {
            const textarea = document.getElementById("code");
            const start = textarea.selectionStart, end = textarea.selectionEnd;
            textarea.value = textarea.value.substring(0, start) + symbol + textarea.value.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + symbol.length;
            textarea.focus();
        }

        // 4. Execução do código
        async function runPython() {
            if (!pyodideReady) return alert("O Python ainda está carregando. Aguarde alguns segundos.");
            if (window.innerWidth < 768) switchTab('output');

            const code = document.getElementById("code").value;
            const outputDiv = document.getElementById("output");
            outputDiv.innerText = "Executando...\n";

            try {
                pyodide.runPython(`import sys, io\nsys.stdout = io.StringIO()`);
                await pyodide.runPythonAsync(code);
                outputDiv.innerText = pyodide.runPython("sys.stdout.getvalue()") || "Executado com sucesso (sem saídas de texto).";
            } catch (err) {
                outputDiv.innerText = "Erro:\n" + err;
            }
        }

        // 5. Lógica PWA: Exibe o botão "Baixar App" SOMENTE se for Mobile
        function isMobileDevice() {
            return (window.innerWidth <= 768) || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (isMobileDevice()) {
                document.getElementById('btn-install').style.display = 'inline-block';
            }
        });

        async function installPWA() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                document.getElementById('btn-install').style.display = 'none';
            }
            deferredPrompt = null;
        }

        // Registra o Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }
    </script>
</body>
</html>
