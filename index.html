<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Python Mobile IDE Pro + AI</title>
    
    <!-- Configurações PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#181825">
    
    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

    <!-- CodeMirror (Editor com Auto-preenchimento) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/anyword-hint.min.js"></script>

    <!-- Fontes e Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-panel: #161824;
            --bg-header: #12141d;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-purple: #8b5cf6;
            --accent-purple-light: #a78bfa;
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: rgba(18, 20, 29, 0.85);
            backdrop-filter: blur(12px);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .logo i { color: var(--accent-purple-light); font-size: 1.1rem; }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        .btn {
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .btn-save {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-save:hover { background-color: rgba(255, 255, 255, 0.15); }

        .btn-run {
            background-color: var(--accent-green);
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn-ai {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #fff;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
        }

        .tabs {
            display: flex;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 4px 8px;
            gap: 6px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn.active {
            color: var(--text-main);
            background-color: var(--bg-panel);
        }

        .main-container { flex: 1; position: relative; overflow: hidden; }

        .panel {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: none; flex-direction: column;
            background-color: var(--bg-panel);
        }

        .panel.active { display: flex; }

        .panel-header {
            background-color: rgba(255, 255, 255, 0.02);
            padding: 6px 14px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Ajuste do CodeMirror */
        .CodeMirror {
            flex: 1;
            height: 100% !important;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            background-color: #0f111a !important;
        }

        .quick-keys {
            display: flex;
            background-color: var(--bg-header);
            padding: 6px 10px;
            gap: 6px;
            overflow-x: auto;
            border-top: 1px solid var(--border-color);
        }

        .quick-key {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            cursor: pointer;
        }

        #output {
            flex: 1;
            background-color: #090a0f;
            color: #38bdf8;
            font-family: 'Fira Code', monospace;
            font-size: 13.5px;
            line-height: 1.6;
            padding: 14px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* Modal da IA */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content textarea {
            width: 100%;
            height: 90px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            resize: none;
            font-family: inherit;
        }

        @media (min-width: 768px) {
            .tabs, .quick-keys { display: none; }
            .main-container { display: flex; flex-direction: row; gap: 1px; background-color: var(--border-color); }
            .panel { position: relative; display: flex !important; flex: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-brands fa-python"></i>
            <span>Python IDE</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-save" onclick="saveCodeToFile()" title="Salvar arquivo Python">
                <i class="fa-solid fa-download"></i> Salvar
            </button>
            <button class="btn btn-ai" onclick="openAIModal()">
                <i class="fa-solid fa-wand-magic-sparkles"></i> IA
            </button>
            <button class="btn btn-run" onclick="runPython()">
                <i class="fa-solid fa-play"></i>
            </button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" id="tab-editor-btn" onclick="switchTab('editor')">
            <i class="fa-solid fa-code"></i> Código
        </button>
        <button class="tab-btn" id="tab-output-btn" onclick="switchTab('output')">
            <i class="fa-solid fa-terminal"></i> Console
        </button>
    </div>

    <div class="main-container">
        <div class="panel active" id="panel-editor">
            <div class="panel-header">
                <i class="fa-regular fa-file-code"></i> EDITOR DE CÓDIGO (AUTO-COMPLETAR ATIVO)
            </div>
            <textarea id="code">
# Pressione Ctrl+Espaço ou digite para auto-completar
nome = "Dev"
print(f"Olá, {nome}! Bem-vindo à sua IDE Python.")

for i in range(1, 6):
    print("Contagem:", i)
            </textarea>

            <div class="quick-keys">
                <button class="quick-key" onclick="insertSymbol('    ')">TAB</button>
                <button class="quick-key" onclick="insertSymbol(':')">:</button>
                <button class="quick-key" onclick="insertSymbol('(')">(</button>
                <button class="quick-key" onclick="insertSymbol(')')">)</button>
                <button class="quick-key" onclick="insertSymbol('&quot;')">"</button>
                <button class="quick-key" onclick="insertSymbol('\'')">'</button>
                <button class="quick-key" onclick="insertSymbol('=')">=</button>
                <button class="quick-key" onclick="insertSymbol('#')">#</button>
            </div>
        </div>

        <div class="panel" id="panel-output">
            <div class="panel-header">
                <i class="fa-solid fa-terminal"></i> SAÍDA DO CONSOLE
            </div>
            <div id="output">Carregando o Python na memória... Aguarde um instante.</div>
        </div>
    </div>

    <!-- Modal Auxiliar da IA -->
    <div class="modal" id="ai-modal">
        <div class="modal-content">
            <h3><i class="fa-solid fa-robot"></i> Assistente IA Python</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted);">Digite o que precisa (ex: "Crie uma função para calcular fatorial"):</p>
            <textarea id="ai-prompt" placeholder="Descreva o código que deseja gerar..."></textarea>
            <div style="display:flex; gap:8px; justify-content:flex-end;">
                <button class="btn" style="background:rgba(255,255,255,0.1); color:#fff;" onclick="closeAIModal()">Cancelar</button>
                <button class="btn btn-ai" onclick="generateAICode()">Gerar Código</button>
            </div>
        </div>
    </div>

    <script>
        let editor, pyodideReady = false, pyodide;

        window.onload = function() {
            editor = CodeMirror.fromTextArea(document.getElementById("code"), {
                mode: "python",
                theme: "dracula",
                lineNumbers: true,
                indentUnit: 4,
                tabSize: 4,
                lineWrapping: true,
                extraKeys: { "Ctrl-Space": "autocomplete" }
            });

            editor.on("keyup", function (cm, event) {
                if (!cm.state.completionActive && event.keyCode >= 65 && event.keyCode <= 90) {
                    CodeMirror.commands.autocomplete(cm, null, { completeSingle: false });
                }
            });
        };

        async function initPyodide() {
            pyodide = await loadPyodide();
            document.getElementById("output").innerText = "Pronto para executar! Clique em 'Executar'.";
            pyodideReady = true;
        }
        initPyodide();

        function switchTab(tab) {
            document.getElementById("panel-editor").classList.toggle("active", tab === 'editor');
            document.getElementById("panel-output").classList.toggle("active", tab === 'output');
            document.getElementById("tab-editor-btn").classList.toggle("active", tab === 'editor');
            document.getElementById("tab-output-btn").classList.toggle("active", tab === 'output');
            if(tab === 'editor') editor.refresh();
        }

        function insertSymbol(symbol) {
            editor.replaceSelection(symbol);
            editor.focus();
        }

        async function runPython() {
            if (!pyodideReady) return alert("O Python ainda está a carregar.");
            if (window.innerWidth < 768) switchTab('output');

            const code = editor.getValue();
            const outputDiv = document.getElementById("output");
            outputDiv.innerText = "Executando...\n";

            try {
                pyodide.runPython(`import sys, io\nsys.stdout = io.StringIO()`);
                await pyodide.runPythonAsync(code);
                outputDiv.innerText = pyodide.runPython("sys.stdout.getvalue()") || "Executado com sucesso.";
            } catch (err) {
                outputDiv.innerText = "Erro:\n" + err;
            }
        }

        // Função para Salvar o Arquivo no Aparelho
        function saveCodeToFile() {
            const code = editor.getValue();
            const blob = new Blob([code], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "meu_programa.py";
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function openAIModal() { document.getElementById("ai-modal").style.display = "flex"; }
        function closeAIModal() { document.getElementById("ai-modal").style.display = "none"; }

        async function generateAICode() {
            const prompt = document.getElementById("ai-prompt").value;
            if(!prompt) return alert("Digite o que precisa que a IA faça.");
            
            const btn = document.querySelector("#ai-modal .btn-ai");
            btn.innerText = "A gerar...";
            
            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Gere apenas código Python limpo (sem explicações ou marcações de markdown) para: " + prompt)}`);
                const code = await res.text();
                
                editor.setValue(code.trim());
                closeAIModal();
                document.getElementById("ai-prompt").value = "";
            } catch (e) {
                alert("Erro ao conectar com a IA. Tente novamente.");
            } finally {
                btn.innerText = "Gerar Código";
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }
    </script>
</body>
</html>
